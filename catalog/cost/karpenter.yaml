id: karpenter
name: Karpenter / AKS node auto-provisioning
category: Cost
kind: planned
phase: '4'
clouds:
- eks
- aks
description: Picks the cheapest VM size, spot first, for pending pods and removes empty nodes. On AKS this is the
  managed Node Auto Provisioning feature (Karpenter run by Azure; needs Azure CNI overlay with Cilium), switched
  on with az aks update, not a chart. On EKS it is the Karpenter chart.
license: Apache-2.0
foundation: Kubernetes
homepage: https://karpenter.sh
