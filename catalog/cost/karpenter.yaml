id: karpenter
name: Karpenter (EKS)
category: Cost
kind: planned
phase: '5'
clouds:
- eks
description: Picks the cheapest instance type, Spot first, for pending pods and removes empty nodes. On EKS it is
  the Karpenter chart plus per-cluster IAM (node role, controller role, interruption queue); added when AIO runs
  on EKS. AKS and GKE use the node-autoprovisioning connector.
license: Apache-2.0
foundation: Kubernetes (SIG Autoscaling)
homepage: https://karpenter.sh
