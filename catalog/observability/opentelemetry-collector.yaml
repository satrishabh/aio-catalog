id: opentelemetry-collector
name: OpenTelemetry Collector
category: Observability
kind: managed
phase: '4'
description: 'One collector per node: sends every container''s logs to Loki and the OTLP traces apps send to Tempo.
  Apps opt in to traces with OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.opentelemetry.svc:4318.'
namespace: opentelemetry
chartRepo: https://open-telemetry.github.io/opentelemetry-helm-charts
chart: opentelemetry-collector
version: 0.178.2
previousVersion: 0.178.1
releaseName: otel
valuesPath: values/opentelemetry-collector/values.yaml
requires:
- loki
- tempo
accessHint: kubectl -n opentelemetry get daemonset otel-collector (one pod per node)
probes:
- name: Collector health (this node)
  url: http://otel-collector.opentelemetry.svc:13133/
  expect: Server available
license: Apache-2.0
foundation: CNCF (incubating)
homepage: https://opentelemetry.io
binding:
  label: OpenTelemetry traces
  summary: Sends your app's OpenTelemetry traces to the node's collector (on to Tempo), tagged with app and environment.
  scope: config
  env:
  - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: 'http://otel-collector.opentelemetry.svc:4318' }
  - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
  - { name: OTEL_SERVICE_NAME, value: '${app}' }
  - { name: OTEL_RESOURCE_ATTRIBUTES, value: 'deployment.environment=${env}' }
  exportNote: Needs an OpenTelemetry Collector at otel-collector.opentelemetry.svc:4318 (connectors/opentelemetry-collector,
    with loki and tempo); change OTEL_EXPORTER_OTLP_ENDPOINT to use another one.
