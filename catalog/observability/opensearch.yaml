id: opensearch
name: OpenSearch
category: Observability
kind: managed
phase: '7'
description: 'Search engine for apps (full-text, faceted and vector search), via the OpenSearch Kubernetes Operator:
  an app gets its own OpenSearch cluster from one small OpenSearchCluster manifest in its namespace, with the
  security plugin on, an admin password from a setup script and TLS from a cert-manager CA (no demo users or
  certificates). Installs only the operator; no cluster runs until an app declares one. No privileged sysctl on
  the nodes. Any cloud: data on disks from the default StorageClass. Platform logs stay in Loki.'
namespace: opensearch-operator
deployment: opensearch-operator
chartRepo: https://opensearch-project.github.io/opensearch-k8s-operator
chart: opensearch-operator
version: 3.0.14
previousVersion: 3.0.12
releaseName: opensearch-operator
valuesPath: values/opensearch/values.yaml
extrasPath: extras/opensearch
requires:
- cert-manager
accessHint: 'kubectl get opensearchclusters -A. A cluster for an app: run setup/opensearch-cluster-secrets.sh <ns>
  <cluster> (aio-catalog), then apply the example in values/opensearch/values.yaml; the app uses https://<cluster>.<ns>.svc:9200
  and trusts ca.crt from Secret <cluster>-ca.'
probes:
- name: Operator ready
  url: http://opensearch-operator-health.opensearch-operator.svc:8081/readyz
  expect: ok
license: Apache-2.0
foundation: Linux Foundation (OpenSearch Software Foundation)
homepage: https://opensearch.org
pinNote: 'Operator chart repo (opensearch-k8s-operator), not the plain opensearch chart. The rollback target 3.0.12
  runs operator image 3.0.0-beta (its chart appVersion); the charts are otherwise identical.'
binding:
  label: OpenSearch cluster
  summary: Your own 1-node OpenSearch with the security plugin and TLS, admin password generated by the operator.
  scope: instance
  envs: [dev, staging, prod]
  options:
  - { id: disk, label: Disk size, default: 5Gi, choices: [5Gi, 10Gi, 20Gi] }
  manifests: bindings/opensearch.yaml
  env:
  - { name: OPENSEARCH_URL, value: 'https://${name}.${namespace}.svc:9200' }
  - { name: OPENSEARCH_USERNAME, secret: '${name}-admin-password', key: username }
  - { name: OPENSEARCH_PASSWORD, secret: '${name}-admin-password', key: password }
  - { name: OPENSEARCH_CA_CERT, secret: '${name}-ca', key: ca.crt }
  exportNote: Needs the OpenSearch operator (connectors/opensearch) and cert-manager. The operator creates Secret
    <app>-opensearch-admin-password (username, password) and cert-manager Secret <app>-opensearch-ca (ca.crt); the
    app uses the admin user, so create a user per app for production. Detaching deletes the cluster.
