id: cloudnative-pg
name: CloudNativePG
category: Data
kind: managed
phase: '5'
description: 'PostgreSQL operator for apps: an app gets its own database cluster from one small Cluster manifest,
  with failover, rolling minor upgrades and a generated app Secret. Installs only the operator; databases are
  created per app. Any cloud: data on disks from the default StorageClass.'
namespace: cnpg-system
deployment: cnpg-controller-manager
chartRepo: https://cloudnative-pg.github.io/charts
chart: cloudnative-pg
version: 0.29.1
previousVersion: 0.29.0
releaseName: cnpg
valuesPath: values/cloudnative-pg/values.yaml
extrasPath: extras/cloudnative-pg
accessHint: 'kubectl get clusters.postgresql.cnpg.io -A. A database for an app: see the example in values/cloudnative-pg/values.yaml
  (aio-catalog); the app reads Secret <cluster>-app (keys uri, host, username, password).'
probes:
- name: Operator controllers running
  url: http://cnpg-metrics.cnpg-system.svc:8080/metrics
  expect: controller="cluster"
license: Apache-2.0
foundation: CNCF (sandbox)
homepage: https://cloudnative-pg.io
binding:
  label: PostgreSQL database
  summary: Your own PostgreSQL cluster in this environment, with a generated user and password.
  scope: instance
  envs: [dev, staging, prod]
  options:
  - { id: storage, label: Disk size, default: 1Gi, choices: [1Gi, 5Gi, 10Gi] }
  - { id: instances, label: Instances, default: '1', choices: ['1', '2', '3'] }
  manifests: bindings/cloudnative-pg.yaml
  env:
  - { name: DATABASE_URL, secret: '${name}-app', key: uri }
  - { name: PGHOST, value: '${name}-rw' }
  - { name: PGUSER, secret: '${name}-app', key: username }
  - { name: PGPASSWORD, secret: '${name}-app', key: password }
  - { name: PGDATABASE, secret: '${name}-app', key: dbname }
  exportNote: Needs the CloudNativePG operator (connectors/cloudnative-pg). The operator creates Secret <app>-cloudnative-pg-app
    (uri, host, username, password, dbname); detaching deletes the cluster and its data.
