id: valkey
name: Valkey
category: Data
kind: managed
phase: '5'
description: 'Shared in-memory key-value store for apps in dev and staging (cache, queues, sessions): the open-source
  fork of Redis, which is no longer OSI-licensed. Drop-in compatible with Redis clients. Password required; data
  is kept on a disk and survives restarts.'
namespace: valkey
deployment: valkey
chartRepo: https://valkey.io/valkey-helm
chart: valkey
version: 0.12.1
previousVersion: 0.12.0
releaseName: valkey
valuesPath: values/valkey/values.yaml
accessHint: 'Create the password Secret before Enable: kubectl create ns valkey; kubectl -n valkey create secret generic
  valkey-users --from-literal=default="$(openssl rand -hex 24)". Apps in dev and staging connect to valkey.valkey.svc:6379
  as user default. Shell: kubectl -n valkey exec -it deploy/valkey -c valkey -- valkey-cli --user default --askpass'
probes:
- name: Valkey accepts the password (exporter)
  url: http://valkey-metrics.valkey.svc:9121/metrics
  expect: redis_up 1
license: BSD-3-Clause
foundation: Linux Foundation
homepage: https://valkey.io
pinNote: The metrics sidecar is redis_exporter (ghcr.io/oliver006/redis_exporter, MIT), the exporter the chart ships
  with, from that project's own registry. Test uses it to prove Valkey accepts the password.
binding:
  label: Valkey (Redis-compatible) cache
  summary: The shared Valkey in dev and staging, with its password copied into your namespace and a key prefix of
    your own.
  scope: shared
  envs: [dev, staging]
  env:
  - { name: VALKEY_HOST, value: valkey.valkey.svc }
  - { name: VALKEY_PORT, value: '6379' }
  - { name: VALKEY_PASSWORD, secret: '${app}-valkey', key: password }
  - { name: REDIS_URL, value: 'redis://default:$(VALKEY_PASSWORD)@valkey.valkey.svc:6379' }
  - { name: VALKEY_KEY_PREFIX, value: '${app}:${env}:' }
  copySecret:
    from: valkey-users
    keys: { default: password }
    name: '${app}-valkey'
  exportNote: Uses the shared Valkey (connectors/valkey, dev and staging only). Create Secret <app>-valkey (key password)
    in the app namespace with the password of user default from Secret valkey/valkey-users.
