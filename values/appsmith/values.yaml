# Appsmith values for the "appsmith" connector (chart 3.9.1 / Appsmith Community Edition v2.6.0; rollback target 3.9.0).
# Installed by the AIO portal through Argo CD (app connector-appsmith, namespace appsmith).
#
# Low-code internal tools. One pod (StatefulSet "appsmith") with one disk (/appsmith-stacks, default StorageClass):
# the Community Edition image (appsmith/appsmith-ce, Apache-2.0; the chart's default is the commercial appsmith-ee
# image) runs its own MongoDB and Redis inside the container, bound to localhost, with data on that disk. This is
# Appsmith's single-container layout; the chart's Bitnami MongoDB/Redis/PostgreSQL subcharts and the MongoDB
# operator are all off, so no Bitnami images and no extra pods.
#
# Before Enable, run setup/appsmith-secrets.sh once. It creates Secret appsmith-secrets with
# APPSMITH_ENCRYPTION_PASSWORD and APPSMITH_ENCRYPTION_SALT, which encrypt the datasource credentials stored in the
# database. Never change them on a running install (stored credentials would become unreadable). The internal
# MongoDB/Redis passwords are generated by the container on first start and kept on the disk
# (/appsmith-stacks/configuration/docker.env), never in Git or in a rendered manifest.
#
# Login: the Community Edition has form login (plus Google/GitHub); OIDC/SAML SSO is a paid-edition feature. The
# first account created becomes the instance administrator. A site overlay puts the UI behind the AIO SSO gate
# (oauth2-proxy + Keycloak, sso.mode proxy); people then also have their Appsmith account.
# Without a site overlay: kubectl -n appsmith port-forward svc/appsmith 8080:80 and open http://localhost:8080.
# Apps reach databases and APIs from Appsmith's server pod (egress from namespace appsmith).
image:
  registry: index.docker.io
  repository: appsmith/appsmith-ce
  tag: v2.6.0
  pullPolicy: IfNotPresent

secretName: appsmith-secrets          # envFrom: APPSMITH_ENCRYPTION_PASSWORD, APPSMITH_ENCRYPTION_SALT

applicationConfig:
  APPSMITH_DISABLE_TELEMETRY: "true"
  # Settings of the paid edition's built-in Keycloak; the chart fills in H2 defaults ("sa"/"sa") when they are
  # empty. Not used by the Community Edition: removed.
  APPSMITH_KEYCLOAK_DB_DRIVER: null
  APPSMITH_KEYCLOAK_DB_USERNAME: null
  APPSMITH_KEYCLOAK_DB_PASSWORD: null
  APPSMITH_KEYCLOAK_DB_URL: null

workload:
  kind: StatefulSet                    # the chart's disk for one pod: a ReadWriteOnce volumeClaimTemplate
replicas: 1
autoscaling:
  enabled: false
podDisruptionBudgets:
  enabled: false                       # minAvailable 1 on a single pod would block node drains

persistence:
  enabled: true
  size: 5Gi                            # MongoDB data, Redis dump, logs, backups

# Java server, RTS, Caddy, MongoDB and Redis in one container. Appsmith suggests 4 GiB for the whole stack; this
# is sized for a few builders.
resources:
  requests: { cpu: 250m, memory: 1536Mi }
  limits: { memory: 3Gi }

# First start initialises MongoDB and runs migrations (several minutes on a small node): allow up to 10 minutes.
probes:
  startupProbe: { periodSeconds: 15, failureThreshold: 40 }
  livenessProbe: { periodSeconds: 30, failureThreshold: 4 }
  readinessProbe: { periodSeconds: 15, failureThreshold: 3 }

redis:
  enabled: false
mongodb:
  enabled: false
mongodbCommunity:
  enabled: false
mongodbOperator:
  enabled: false
postgresql:
  enabled: false
prometheus:
  enabled: false
externalSecrets:
  enabled: false
autoupdate:
  enabled: false                       # would pull a moving tag; versions move through the catalog instead
keda:
  enabled: false
ingress:
  enabled: false
service:
  type: ClusterIP
  port: 80
