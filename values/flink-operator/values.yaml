# Apache Flink Kubernetes Operator values for the "flink-operator" connector (chart 1.16.1 / operator 1.16.1).
# No rollback target: Apache publishes one Helm repository per release (downloads.apache.org/flink/
# flink-kubernetes-operator-<version>/), so the pinned repository holds only 1.16.1. To roll back, point chartRepo
# and version at the 1.15.0 repository together (this values file renders with 1.15.0 too).
# Installed by the AIO portal through Argo CD (app connector-flink-operator, namespace flink-operator).
#
# Installs only the operator (one pod: operator + admission webhook containers) and its CRDs (FlinkDeployment,
# FlinkSessionJob, FlinkStateSnapshot, FlinkBlueGreenDeployment; API flink.apache.org). No Flink cluster runs here.
# It watches dev and staging only (watchNamespaces): the chart writes ServiceAccount "flink" (used by the
# JobManager) and the operator's Roles into those two namespaces; no ClusterRole is created. To run jobs in prod, add
# it to watchNamespaces (and to the connectors AppProject).
#
# Smallest example job (not deployed by this connector), in dev: an application cluster with one JobManager and one
# TaskManager, about 1 GiB each while it runs:
#
#   apiVersion: flink.apache.org/v1beta1
#   kind: FlinkDeployment
#   metadata: { name: state-machine, namespace: dev }
#   spec:
#     image: flink:2.2.1-java17              # official Apache Flink image (Docker Hub library/flink)
#     flinkVersion: v2_2
#     serviceAccount: flink                  # created by this connector in dev and staging
#     flinkConfiguration:
#       taskmanager.numberOfTaskSlots: "1"
#     jobManager:
#       resource: { memory: "1024m", cpu: 0.25 }
#     taskManager:
#       resource: { memory: "1024m", cpu: 0.25 }
#     job:
#       jarURI: local:///opt/flink/examples/streaming/StateMachineExample.jar
#       parallelism: 1
#       upgradeMode: stateless                 # savepoint/last-state need a checkpoint directory (S3/GCS/Azure Blob)
#
# kubectl -n dev get flinkdeployment shows job and lifecycle state; Flink UI: kubectl -n dev port-forward
# svc/state-machine-rest 8081. A session cluster (FlinkDeployment without job) + FlinkSessionJob runs several jobs.
#
# Webhook TLS: cert-manager (core) issues the serving certificate (Issuer flink-operator-selfsigned-issuer,
# Certificate flink-operator-serving-cert, Secret webhook-server-cert as a PKCS12 keystore); cainjector writes the CA
# into the webhook configurations. Nothing is generated by the templates, so renders are identical.
# The PKCS12 keystore password is the chart's fixed Secret flink-operator-webhook-secret: it protects nothing (the
# same Secret webhook-server-cert holds tls.key in clear text), so no setup script is needed.
# Webhooks (failurePolicy Fail) only see flink.apache.org objects in dev and staging; no pod or namespace is
# intercepted, so a down operator only blocks creating/changing Flink jobs.

watchNamespaces: [dev, staging]

replicas: 1

operatorPod:
  resources:
    requests: { cpu: 50m, memory: 384Mi }
    limits: { memory: 768Mi }
  webhook:
    resources:
      requests: { cpu: 10m, memory: 192Mi }
      limits: { memory: 384Mi }

# Both containers are JVMs; let the heap use half of the memory limit (default is a quarter).
jvmArgs:
  operator: "-XX:MaxRAMPercentage=50"
  webhook: "-XX:MaxRAMPercentage=50"

webhook:
  create: true

operatorVolumes:
  create: false                  # the chart's optional hostPath artifacts volume stays off
operatorVolumeMounts:
  create: false

rbac:
  nodesRule:
    create: false

tls:
  create: false                  # operator-to-JobManager TLS off (needs its own keystore Secret)
