# GKE node auto-provisioning with a custom ComputeClass "aio-spot": GKE creates node pools as needed, Spot VMs
# first and on-demand when Spot is unavailable, and moves pods back to Spot when it returns.
# Opt-in: a pod uses it with the node selector  cloud.google.com/compute-class: aio-spot  (dev and staging, once
# the app chart sets it). Pods without the selector keep using the cluster's existing node pools; prod never sets it.
resources:
  - apiVersion: cloud.google.com/v1
    kind: ComputeClass
    metadata:
      name: aio-spot
    spec:
      priorities:
        - machineFamily: e2
          spot: true
        - machineFamily: e2
          spot: false
      activeMigration:
        optimizeRulePriority: true   # move back to Spot when it is available again
      nodePoolAutoCreation:
        enabled: true
      whenUnsatisfiable: DoNotScaleUp
