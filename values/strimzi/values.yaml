# Strimzi values for the "strimzi" connector (chart 1.3.1 / operator 1.3.1; rollback target 1.3.0).
# Installed by the AIO portal through Argo CD (app connector-strimzi, namespace strimzi).
#
# Installs only the Strimzi cluster operator and its CRDs (Kafka, KafkaNodePool, KafkaTopic, KafkaUser, KafkaConnect,
# KafkaBridge, KafkaMirrorMaker2, KafkaRebalance; API kafka.strimzi.io/v1). It watches every namespace; no Kafka
# cluster is created here. Each app that needs Kafka declares its own cluster in its namespace, for example a small
# single-node KRaft cluster in dev (not deployed by this connector):
#
#   apiVersion: kafka.strimzi.io/v1
#   kind: KafkaNodePool
#   metadata:
#     name: dual
#     namespace: dev
#     labels: { strimzi.io/cluster: shop-kafka }
#   spec:
#     replicas: 1                       # 3 in prod (and raise the replication factors below)
#     roles: [controller, broker]       # KRaft: one node is both controller and broker
#     storage: { type: persistent-claim, size: 5Gi, deleteClaim: false }   # default StorageClass
#     resources:
#       requests: { cpu: 100m, memory: 768Mi }
#       limits: { memory: 1Gi }
#   ---
#   apiVersion: kafka.strimzi.io/v1
#   kind: Kafka
#   metadata: { name: shop-kafka, namespace: dev }
#   spec:
#     kafka:
#       # version: leave unset to use the operator's default Kafka version (4.2.x/4.3.x for this operator)
#       listeners:
#         - { name: plain, port: 9092, type: internal, tls: false }
#       config:
#         offsets.topic.replication.factor: 1
#         transaction.state.log.replication.factor: 1
#         transaction.state.log.min.isr: 1
#         default.replication.factor: 1
#         min.insync.replicas: 1
#     entityOperator:
#       topicOperator: {}               # manages KafkaTopic resources of this cluster
#       userOperator: {}                # manages KafkaUser resources (needs authentication on a listener)
#   ---
#   apiVersion: kafka.strimzi.io/v1
#   kind: KafkaTopic
#   metadata:
#     name: orders
#     namespace: dev
#     labels: { strimzi.io/cluster: shop-kafka }
#   spec: { partitions: 3, replicas: 1 }
#
# The app connects to shop-kafka-kafka-bootstrap.dev.svc:9092. Strimzi also writes NetworkPolicies and a
# PodDisruptionBudget for each cluster. Kafka runs on the official Strimzi images from quay.io/strimzi.
# No secrets or setup script: TLS certificates of each Kafka cluster are generated by the operator at run time.
# Backups: Velero (phase 3) copies the volumes; Kafka itself is best protected by replicas: 3 in prod.

watchAnyNamespace: true          # apps create Kafka resources in their own namespaces (ClusterRoleBindings)
watchNamespaces: []

replicas: 1
resources:
  requests: { cpu: 50m, memory: 384Mi }   # Strimzi's documented minimum memory for the operator
  limits: { memory: 512Mi }

dashboards:
  enabled: false                  # turn on when Grafana is enabled
