# kube-prometheus-stack values for the "prometheus" connector (chart 92.17.1; rollback target 92.16.2).
# Installed by the AIO portal through Argo CD (app connector-prometheus, namespace monitoring).
# Sized for a small cluster; works on any conformant Kubernetes (uses the default StorageClass).
fullnameOverride: kps          # services: kps-prometheus:9090, kps-alertmanager:9093, kps-grafana:80

# Managed control planes (GKE, EKS, AKS, OKE) do not expose these components to scrape.
# Set to true on self-managed clusters (kubeadm, k3s, on-prem).
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    # Pick up ServiceMonitors/PodMonitors/rules from every release (Trivy Operator, OpenCost, KEDA, apps)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests: { storage: 10Gi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 128Mi }

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 64Mi }

grafana:
  fullnameOverride: kps-grafana   # admin password: Secret kps-grafana, key admin-password (generated)
  # Other connectors bring their own datasource as a ConfigMap labelled grafana_datasource=1 in their namespace
  # (loki, tempo: extras/<id>-datasource); disabling one removes its datasource again.
  sidecar:
    datasources:
      searchNamespace: ALL
  persistence:
    enabled: false                 # dashboards come from the chart; nothing stateful worth a disk
  # Grafana 13 uses ~250Mi once dashboards are provisioned; at a 256Mi limit it ran out of headroom during start-up
  # and failed its health probe, restarting in a loop (2026-11-21).
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  grafana.ini:
    plugins:
      # Grafana otherwise downloads several app plugins from grafana.com on every start. They time out from the
      # cluster and slow start-up; none of them is needed for the bundled dashboards.
      preinstall_disabled: true
