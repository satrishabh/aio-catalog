# Apache Airflow values for the "airflow" connector (chart 1.22.0 / Airflow 3.2.2; rollback target 1.21.0 / 3.2.0).
# Installed by the AIO portal through Argo CD (app connector-airflow, namespace airflow).
#
# Data and batch workflows as Python DAGs, sized for a small cluster:
#   api-server (UI + REST API, FAB auth manager), scheduler, dag-processor; no triggerer, statsd, Redis, Celery,
#   flower or PgBouncer. The metadata database is a CloudNativePG cluster (extras/airflow, so the
#   "cloudnative-pg" connector is required); the chart's Bitnami PostgreSQL subchart is off.
#
# Executor: LocalExecutor. Tasks run as subprocesses of the scheduler pod (at most core.parallelism = 4 at a time),
# so there is no message broker and no pod per task. KubernetesExecutor would start a full Airflow pod (~250 MiB,
# 10-30 s start-up) for every task, which a nearly full 2-node cluster cannot schedule reliably. Task logs are kept
# on a 2 Gi disk of the scheduler StatefulSet and served to the UI by the scheduler's log server.
#
# Before Enable, run setup/airflow-secrets.sh once. Under Argo CD the chart would otherwise generate the fernet key,
# API secret key and JWT secret again on every render (randAlphaNum), so connections and variables stored with the
# old fernet key would become unreadable and sessions would break. Every secret comes from:
#   Secret airflow-secrets: fernet-key, api-secret-key, webserver-secret-key, jwt-secret, admin-password
#   Secret airflow-db-app:  created by CloudNativePG (key "uri" = metadata DB connection)
# The UI user "admin" (role Admin) is created by the create-user job with admin-password; with a site overlay
# people sign in with Keycloak instead (site-<site>.yaml).
#
# DAGs: none by default (the image's dags folder is empty). To load DAGs from Git, set in a site overlay or here:
#   dags:
#     gitSync:
#       enabled: true
#       repo: https://github.com/<org>/<dags-repo>.git
#       branch: main
#       ref: main
#       subPath: dags
#       credentialsSecret: airflow-git        # private repo: GITSYNC_USERNAME / GITSYNC_PASSWORD (kubectl, not Git)
# git-sync then runs beside the scheduler and the dag-processor and pulls every 60 s.
#
# The migration and create-user jobs are Argo CD Sync hooks (not Helm hooks: a post-install hook would become a
# PostSync hook that waits for pods which themselves wait for the migration). Both are safe to rerun:
# "airflow db migrate" is idempotent and "airflow users create" skips an existing user.

executor: LocalExecutor
allowPodLaunching: false               # LocalExecutor starts no pods: no pod-launcher Role for the scheduler

images:
  migrationsWaitTimeout: 600           # wait-for-migrations init containers: the first install builds the schema

# Metadata DB: CloudNativePG cluster airflow-db (extras/airflow/database.yaml). The chart's own connection Secret
# is not used; every Airflow container reads the URI from the Secret CloudNativePG creates.
postgresql:
  enabled: false
data:
  metadataSecretName: airflow-db-app   # set so the chart renders no connection Secret with a default password
  brokerUrlSecretName: airflow-secrets # no Celery: only stops the chart from rendering an empty broker Secret
enableBuiltInSecretEnvVars:
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: false
  AIRFLOW_CONN_AIRFLOW_DB: false
secret:
  - envName: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
    secretName: airflow-db-app
    secretKey: uri
  - envName: AIRFLOW_CONN_AIRFLOW_DB
    secretName: airflow-db-app
    secretKey: uri

# Fixed secrets from setup/airflow-secrets.sh (never generated by the chart)
fernetKeySecretName: airflow-secrets          # key fernet-key
apiSecretKeySecretName: airflow-secrets       # key api-secret-key (Airflow 3)
webserverSecretKeySecretName: airflow-secrets # key webserver-secret-key (only read by Airflow 2, rollback safety)
jwtSecretName: airflow-secrets                # key jwt-secret

config:
  core:
    parallelism: 4                     # LocalExecutor: at most 4 task processes in the scheduler pod
    max_active_tasks_per_dag: 4
    load_examples: 'False'
  api:
    workers: 1                         # one uvicorn worker (default 4) keeps the api-server under 1 GiB
  scheduler:
    enable_health_check: 'True'
  logging:
    remote_logging: 'False'

migrateDatabaseJob:
  useHelmHooks: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  ttlSecondsAfterFinished: ~           # Argo CD deletes the old job before the next sync
  # The CloudNativePG cluster is created in the same sync: wait for it before migrating.
  args:
    - bash
    - -c
    - >-
      airflow db check --retry 60 --retry-delay 10 &&
      exec airflow db migrate
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 1Gi }

createUserJob:
  useHelmHooks: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  ttlSecondsAfterFinished: ~
  # Admin user "admin" with the password from Secret airflow-secrets; skipped when the user exists. Waits until
  # the migration job has built the schema (it runs in the same sync).
  env:
    - name: AIRFLOW_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef: { name: airflow-secrets, key: admin-password }
  args:
    - bash
    - -c
    - >-
      airflow db check --retry 60 --retry-delay 10 &&
      airflow db check-migrations --migration-wait-timeout 900 &&
      exec airflow users create --role Admin --username admin --email admin@airflow.local
      --firstname Airflow --lastname Admin --password "$AIRFLOW_ADMIN_PASSWORD"
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 1Gi }

apiServer:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }
  startupProbe:
    failureThreshold: 30               # first start loads the FAB app and its roles

scheduler:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { memory: 2Gi }            # scheduler + up to 4 LocalExecutor task processes
  logGroomerSidecar:
    retentionDays: 7
    resources:
      requests: { cpu: 5m, memory: 32Mi }
      limits: { memory: 128Mi }

# LocalExecutor + workers.persistence makes the scheduler a StatefulSet whose disk holds the task logs.
workers:
  persistence:
    enabled: true
    size: 2Gi
  celery:
    persistence:
      enabled: true
      size: 2Gi

dagProcessor:
  enabled: true                        # required by Airflow 3
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 1Gi }
  logGroomerSidecar:
    retentionDays: 7
    resources:
      requests: { cpu: 5m, memory: 32Mi }
      limits: { memory: 128Mi }

dags:
  gitSync:
    enabled: false
    period: 60s
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 256Mi }

# Deferrable operators need the triggerer; turn it on (enabled: true, ~300 MiB) if your DAGs use them.
triggerer:
  enabled: false

redis:
  enabled: false
statsd:
  enabled: false
pgbouncer:
  enabled: false
flower:
  enabled: false
cleanup:
  enabled: false
