# Grafana datasource for the tempo connector, picked up by the Grafana sidecar of the prometheus connector
# (label grafana_datasource=1, searched in all namespaces). Synced with the Tempo chart; removed on Disable.
# From a span, "Logs for this span" opens the pod's logs in Loki (when the loki connector is enabled).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-grafana-datasource
  labels:
    grafana_datasource: "1"
data:
  tempo.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.tempo.svc:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            filterByTraceID: true
            tags:
              - key: k8s.namespace.name
                value: k8s_namespace_name
              - key: k8s.pod.name
                value: k8s_pod_name
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
