# MariaDB (root password only, no TLS) may only be reached by pods in the erpnext namespace.
# The two Valkeys get the same rule from the chart (networkPolicy in values/erpnext/values.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erpnext-mariadb
  namespace: erpnext
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: erpnext-mariadb-sts
      app.kubernetes.io/instance: erpnext
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { port: 3306, protocol: TCP }
