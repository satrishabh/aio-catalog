# Configures the bench, creates site "erpnext" on the first sync and migrates it on later syncs.
# An Argo CD Sync hook (rerun at every sync, the previous run deleted first), so its fixed name never drifts and an
# image change never hits the immutable Job template. Safe to rerun: config writes are idempotent, the site is
# created only when the marker file is missing, and "bench migrate" is a no-op when nothing changed.
# The image tag must equal image.tag in values/erpnext/values.yaml (bump both together).
# Secrets come from Secret "erpnext" (setup/erpnext-secrets.sh); nothing is stored on the volume except what
# ERPNext itself writes (the site's own database password in sites/erpnext/site_config.json).
apiVersion: batch/v1
kind: Job
metadata:
  name: erpnext-site
  namespace: erpnext
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 5400
  template:
    metadata:
      labels:
        app.kubernetes.io/app: frappe          # podAffinity group: same node as the other Frappe pods (RWO disk)
        app.kubernetes.io/name: erpnext-site
    spec:
      restartPolicy: Never
      securityContext:
        supplementalGroups: [1000]
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/app: frappe
      initContainers:
        # A new volume is owned by root; ERPNext runs as user frappe (1000).
        - name: sites-owner
          image: frappe/erpnext:v16.54.0
          command: [sh, -c, 'chown -R 1000:1000 /home/frappe/frappe-bench/sites']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities: { drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: sites, mountPath: /home/frappe/frappe-bench/sites }
      containers:
        - name: site
          image: frappe/erpnext:v16.54.0
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              cd /home/frappe/frappe-bench
              ls -1 apps > sites/apps.txt
              [ -f sites/common_site_config.json ] || echo "{}" > sites/common_site_config.json
              bench set-config -g db_host erpnext-mariadb-sts
              bench set-config -gp db_port 3306
              bench set-config -g redis_cache redis://erpnext-valkey-cache:6379
              bench set-config -g redis_queue redis://erpnext-valkey-queue:6379
              bench set-config -g redis_socketio redis://erpnext-valkey-queue:6379
              bench set-config -gp socketio_port 9000
              wait-for-it -t 900 erpnext-mariadb-sts:3306
              wait-for-it -t 300 erpnext-valkey-cache:6379
              wait-for-it -t 300 erpnext-valkey-queue:6379
              if [ -f sites/.aio-site-created ]; then
                echo "Site erpnext exists: migrating"
                bench --site erpnext migrate
              else
                echo "Creating site erpnext (takes several minutes)"
                force=""
                [ -d sites/erpnext ] && force="--force"   # an earlier attempt failed halfway: start over
                bench new-site erpnext $force --mariadb-user-host-login-scope='%' \
                  --db-root-username root --db-root-password "$DB_ROOT_PASSWORD" \
                  --admin-password "$ADMIN_PASSWORD" --install-app erpnext --set-default
                touch sites/.aio-site-created
              fi
              if [ -n "${SITE_URL:-}" ]; then
                bench --site erpnext set-config host_name "$SITE_URL"
              fi
              echo "Site erpnext ready"
          env:
            - name: DB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: erpnext, key: mariadb-root-password } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: erpnext, key: admin-password } }
            - name: SITE_URL
              valueFrom: { secretKeyRef: { name: erpnext, key: site-url, optional: true } }
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1536Mi }
          volumeMounts:
            - { name: sites, mountPath: /home/frappe/frappe-bench/sites }
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: erpnext-sites
