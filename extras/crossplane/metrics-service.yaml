# Plain-HTTP Service for Crossplane core's metrics port, so the AIO connector Test can check that the package
# manager's controllers are running (the chart only exposes the TLS webhook port).
apiVersion: v1
kind: Service
metadata:
  name: crossplane-metrics
  namespace: crossplane-system
  labels:
    app: crossplane
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app: crossplane
    release: crossplane
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
