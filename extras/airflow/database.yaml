# Airflow's metadata database, run by the CloudNativePG operator (connector "cloudnative-pg").
# The operator creates Secret airflow-db-app (key "uri" is read by every Airflow container as
# AIRFLOW__DATABASE__SQL_ALCHEMY_CONN) and the Service airflow-db-rw. Nightly Velero backups (phase 3) copy its volume.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: airflow-db
  namespace: airflow
spec:
  instances: 1
  storage:
    size: 5Gi
  resources:
    requests: { cpu: 30m, memory: 160Mi }
    limits: { memory: 512Mi }
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "100"
  bootstrap:
    initdb:
      database: airflow
      owner: airflow
