# Harbor's PostgreSQL, run by the CloudNativePG operator (connector "cloudnative-pg").
# The operator creates Secret harbor-db-app (username harbor, key "password") that Harbor reads, and the
# Service harbor-db-rw. Nightly Velero backups (phase 3) copy its volume.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
  namespace: harbor
spec:
  instances: 1
  storage:
    size: 5Gi
  resources:
    requests: { cpu: 30m, memory: 160Mi }
    limits: { memory: 512Mi }
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "100"
  bootstrap:
    initdb:
      database: registry
      owner: harbor
