# Gitea's PostgreSQL, run by the CloudNativePG operator (connector "cloudnative-pg").
# The operator creates Secret gitea-db-app (username gitea, key "password") that Gitea reads, and the
# Service gitea-db-rw. Nightly Velero backups (phase 3) copy its volume.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-db
  namespace: gitea
spec:
  instances: 1
  storage:
    size: 5Gi
  resources:
    requests: { cpu: 30m, memory: 160Mi }
    limits: { memory: 512Mi }
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "100"
  bootstrap:
    initdb:
      database: gitea
      owner: gitea
