# Recurring job: dev sleeps at 20:00 IST Monday-Friday and wakes at 08:00 IST Monday-Friday.
# Because there is no wake-up on Saturday or Sunday, Friday night's sleep lasts until Monday 08:00.
# Deployments and StatefulSets are scaled to 0 and CronJobs suspended; the original replica counts are kept in a Secret
# managed by kube-green and restored on wake-up.
# Opt-out: anything labelled kube-green.dev/exclude: "true" is left alone (Deployments, StatefulSets and CronJobs alike).
# Use it for an app with its own night schedule, whose CronJobs would otherwise be suspended too. With the AIO app chart:
# `labels: { kube-green.dev/exclude: "true" }` in the app's values (Deployment label only, no restart).
apiVersion: kube-green.com/v1alpha1
kind: SleepInfo
metadata:
  name: off-hours
  namespace: dev
spec:
  weekdays: "1-5"
  sleepAt: "20:00"
  wakeUpAt: "08:00"
  timeZone: Asia/Kolkata
  suspendCronJobs: true
  excludeRef:
    - matchLabels:                  # label-only entries must not set kind/apiVersion/name (kube-green validation)
        kube-green.dev/exclude: "true"
