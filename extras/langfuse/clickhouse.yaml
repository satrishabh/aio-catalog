# Langfuse's ClickHouse (traces, observations, scores): one plain single-node server, official image
# clickhouse/clickhouse-server (Apache-2.0). The chart's own ClickHouse needs the ClickHouse operator (alpha) and a
# Keeper ensemble; a single node needs neither (Langfuse runs with CLICKHOUSE_CLUSTER_ENABLED=false).
# Keep the image tag aligned with clickhouse.cluster.image.tag in the pinned Langfuse chart (2.2.3: 26.8.36.3).
#
# User "langfuse" with the password from Secret langfuse-clickhouse (setup/langfuse-secrets.sh); the image's
# entrypoint writes it to users.d at every start and removes the password-less "default" user.
# Low-memory settings: small caches, server memory capped at 80% of the container limit, system log tables off,
# server log to stdout only (no log files filling the container).
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-clickhouse
  namespace: langfuse
data:
  low-memory.xml: |
    <clickhouse>
      <logger>
        <level>warning</level>
        <console>1</console>
        <log remove="remove"/>
        <errorlog remove="remove"/>
      </logger>
      <max_server_memory_usage_to_ram_ratio>0.8</max_server_memory_usage_to_ram_ratio>
      <mark_cache_size>268435456</mark_cache_size>
      <index_mark_cache_size>67108864</index_mark_cache_size>
      <uncompressed_cache_size>16777216</uncompressed_cache_size>
      <max_concurrent_queries>64</max_concurrent_queries>
      <query_log remove="remove"/>
      <query_thread_log remove="remove"/>
      <query_views_log remove="remove"/>
      <query_metric_log remove="remove"/>
      <part_log remove="remove"/>
      <trace_log remove="remove"/>
      <metric_log remove="remove"/>
      <asynchronous_metric_log remove="remove"/>
      <asynchronous_insert_log remove="remove"/>
      <text_log remove="remove"/>
      <processors_profile_log remove="remove"/>
      <opentelemetry_span_log remove="remove"/>
      <latency_log remove="remove"/>
      <error_log remove="remove"/>
      <session_log remove="remove"/>
      <backup_log remove="remove"/>
      <s3queue_log remove="remove"/>
      <blob_storage_log remove="remove"/>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-clickhouse
  namespace: langfuse
  labels: { app.kubernetes.io/name: clickhouse, app.kubernetes.io/instance: langfuse }
spec:
  selector: { app.kubernetes.io/name: clickhouse, app.kubernetes.io/instance: langfuse }
  ports:
    - { name: http, port: 8123, targetPort: http, protocol: TCP }
    - { name: native, port: 9000, targetPort: native, protocol: TCP }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-clickhouse
  namespace: langfuse
  labels: { app.kubernetes.io/name: clickhouse, app.kubernetes.io/instance: langfuse }
spec:
  serviceName: langfuse-clickhouse
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: clickhouse, app.kubernetes.io/instance: langfuse }
  template:
    metadata:
      labels: { app.kubernetes.io/name: clickhouse, app.kubernetes.io/instance: langfuse }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.8.36.3
          env:
            - { name: CLICKHOUSE_USER, value: langfuse }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: langfuse-clickhouse, key: password } }
          ports:
            - { name: http, containerPort: 8123, protocol: TCP }
            - { name: native, containerPort: 9000, protocol: TCP }
          startupProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: config, mountPath: /etc/clickhouse-server/config.d/low-memory.xml, subPath: low-memory.xml }
      volumes:
        - name: config
          configMap: { name: langfuse-clickhouse }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 10Gi }
---
# ClickHouse serves Langfuse only: nothing outside this namespace may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: langfuse-clickhouse
  namespace: langfuse
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: clickhouse, app.kubernetes.io/instance: langfuse }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
